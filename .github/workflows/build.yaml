name: build-image

on:
  push:
    branches: [main]
    paths: [Containerfile, .github/workflows/build.yaml]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Ref of foxfirecodes/michaels-cal to build
        default: main
  schedule:
    - cron: "0 6 * * 1" # weekly rebuild to pick up base image patches

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: foxfirecodes/michaels-cal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: app

      - id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/michaels-cal" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C app rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: app
          file: Containerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
