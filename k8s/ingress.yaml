# Optional. The calendar contains your shift schedule, so use an unguessable
# path or add auth at the ingress if this is exposed to the internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: michaels-cal
  namespace: michaels-cal
spec:
  # ingressClassName: nginx
  rules:
    - host: cal.example.com
      http:
        paths:
          - path: /michaels-cal.ics
            pathType: Exact
            backend:
              service:
                name: michaels-cal
                port:
                  name: http
  # tls:
  #   - hosts: [cal.example.com]
  #     secretName: michaels-cal-tls
