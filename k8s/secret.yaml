# Example only. Prefer creating this out-of-band so credentials stay out of git:
#   kubectl -n michaels-cal create secret generic michaels-cal \
#     --from-literal=MICHAELS_USER=... --from-literal=MICHAELS_PASS=...
apiVersion: v1
kind: Secret
metadata:
  name: michaels-cal
  namespace: michaels-cal
type: Opaque
stringData:
  MICHAELS_USER: "changeme"
  MICHAELS_PASS: "changeme"
